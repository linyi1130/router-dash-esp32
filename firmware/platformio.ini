; Waveshare ESP32-S3-RLCD-4.2（ESP32-S3-WROOM-1-N16R8，ST7305 单色 400x300 SPI）。
; 显示使用 U8g2 + Waveshare 官方自定义 ST7305 驱动。
; board 沿用已验证可烧录的 lilygo-t-display-s3 配置（同为 ESP32-S3 N16R8 + OPI PSRAM）。

[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  olikraus/U8g2@^2.36.18
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder
